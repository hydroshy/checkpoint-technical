version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checkpoint_technical_app
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - JWT_SECRET=Daviteq_Checkpoint_Technical_Key_2026_Secure!
      # PostgreSQL Server Initialization Variables
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=checkpoint_technical
      - DB_AUTO_INIT=true
      # Alternative Standard Postgres Env
      - POSTGRES_HOST=postgres_db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=checkpoint_technical
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - checkpoint_net

  postgres_db:
    image: postgres:15-alpine
    container_name: checkpoint_technical_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: checkpoint_technical
    ports:
      - "5432:5432"
    volumes:
      - checkpoint_pgdata:/var/lib/postgresql/data
      - ./config/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkpoint_technical"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - checkpoint_net

networks:
  checkpoint_net:
    driver: bridge

volumes:
  checkpoint_pgdata:
